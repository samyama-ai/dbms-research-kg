server:
  name: dbms-research-kg
  description: Query the DBMS Research knowledge graph
graph:
  # The Samyama engine serves one graph ("default") per instance, so the URL picks the dataset.
  url: http://127.0.0.1:8094
  # Name written into exported .sgsnap files; matches the published 2026-09 snapshot.
  snapshot_tenant: dbms-research
