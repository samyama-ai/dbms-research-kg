[project]
name = "dbms-research-kg"
version = "0.1.0"
description = "DBMS Research knowledge graph built on Samyama"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "samyama>=0.6.0",
    "requests>=2.31",
    "rich>=13.0",
    "click>=8.0",
    "fastmcp>=0.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["etl*", "mcp_server*", "benchmarks*", "demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["data", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E731"]
